<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Reservation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 50%;
            margin: auto;
        }
        input, select {
            padding: 10px;
            margin: 10px 0;
            width: 90%;
        }
        button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add a Reservation</h1>
        <form action="/addReservation" method="post">
            <input type="text" name="restaurant_name" placeholder="Restaurant Name" required><br>
            <input type="number" name="table_id" placeholder="Table ID" required><br>
            <input type="number" name="start_time" placeholder="Start Time (1-24)" required><br>
            <input type="number" name="end_time" placeholder="End Time (1-24)" required><br>
            <input type="text" name="foods" placeholder="Food Items (comma-separated)" required><br>
            <button type="submit">Reserve</button>
        </form>
        <br>
        <a href="/Home">Back to Home</a>
    </div>
</body>
</html>
